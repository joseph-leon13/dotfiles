# ---------------------------------------------------------
# SPECTRAL ICE — near-black navy with smoky cyan highlights
# Matched from Screenshot From 2026-09-12 23-33-07.png.
# Dominant sampled colors: #02070E, #131E28, #243A45, #49656E, #77BBC6.
# ---------------------------------------------------------

font_family JetBrainsMono Nerd Font Mono
font_size 9.0

# Render operators literally: !=, =>, ->, <=, etc. stay as typed characters.
disable_ligatures always

# ---------------------------------------------------------
# SPECTRAL ICE — Color palette
# ---------------------------------------------------------

# Background & Transparency
background              #02070E
background_opacity      0.98
dynamic_background_opacity yes

# Semi-transparent spectral-ice gradient. The PNG contains its own alpha
# channel, so the desktop remains faintly visible through the icy glow.
background_image        spectral-ice-background.png
background_image_layout scaled
background_image_linear yes
background_tint         0.96
background_tint_gaps    1.0

# Foreground / Text — high-contrast frost white
foreground              #FFFFFF

# Selection
selection_foreground    #D5E8EB
selection_background    #324C55

# Cursor
cursor                  #77BBC6
cursor_text_color       #02070E

# URL underline color when hovering with mouse
url_color               #77BBC6

# Window borders
active_border_color     #77BBC6
inactive_border_color   #243A45
bell_border_color       #B8A77A

# Tab bar — deep slate with an icy active tab
active_tab_foreground   #D5E8EB
active_tab_background   #324C55
inactive_tab_foreground #618B95
inactive_tab_background #131E28
tab_bar_background      #02070E

# Marks
mark1_foreground #02070E
mark1_background #77BBC6
mark2_foreground #02070E
mark2_background #A89AB8
mark3_foreground #02070E
mark3_background #8CB7A6

# Terminal colors (16-color palette) — muted aurora tones on spectral navy
# black
color0  #0B141D
color8  #49656E

# red
color1  #E68B95
color9  #FFABB4

# green
color2  #8FC4AC
color10 #AFE0C8

# yellow
color3  #D4BD82
color11 #ECD69B

# blue
color4  #7FAFC3
color12 #9DCCE0

# magenta
color5  #B09FC3
color13 #CEBAE1

# cyan
color6  #70BDCB
color14 #91DCE7

# white
color7  #D5E8EB
color15 #FFFFFF

# ---------------------------------------------------------
# WINDOW LAYOUT
# ---------------------------------------------------------

window_padding_width 4

draw_minimal_borders yes
window_border_width 2pt
active_border_color   #77BBC6
inactive_border_color #243A45

# Inactive text alpha — dimmer inactive panes make the active one obvious
inactive_text_alpha 0.85

# Hide the OS Title Bar
linux_display_server wayland
hide_window_decorations yes

# Tiling Layout
enabled_layouts tall, grid, stack, splits, vertical


# ---------------------------------------------------------
# MANUAL SPLITTING (Requires the 'splits' layout)
# ---------------------------------------------------------

map ctrl+alt+h launch --location=hsplit --cwd=current
map ctrl+alt+v launch --location=vsplit --cwd=current
map ctrl+alt+s goto_layout splits
map ctrl+alt+d detach_window ask
map ctrl+alt+shift+d detach_tab ask


# ---------------------------------------------------------
# BROADCAST MODE
# ---------------------------------------------------------

allow_remote_control yes
listen_on unix:/tmp/kitty
map f11 launch --allow-remote-control kitty +kitten broadcast --match-tab state:focused
